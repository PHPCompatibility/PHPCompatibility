name: Check PRs for merge conflicts

on:
  # Check for new conflicts due to merges.
  push:
    branches:
      - master
      - develop
  # Check conflicts in new PRs and for resolved conflicts due to an open PR being updated.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

# Permissions should be configured at the job level.
permissions: {}

jobs:
  check-prs:
    permissions:
      pull-requests: write # To add and remove PR labels.

    if: github.repository_owner == 'PHPCompatibility'

    name: Check PRs for merge conflicts
    runs-on: ubuntu-latest

    steps:
      - name: Check PRs for merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "Status: has merge conflict"
          repoToken: ${{ secrets.GITHUB_TOKEN }}
